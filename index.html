<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原神角色名字匹配游戏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
#app{max-width:980px;margin:0 auto;padding:16px}

.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #334;margin-bottom:14px}
.title{font-size:20px;font-weight:700;color:#ffd700;letter-spacing:2px}
.round-info{font-size:13px;color:#888}

.progress-bar{height:3px;background:#223;border-radius:2px;margin-bottom:14px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4ecdc4,#45b7d1);border-radius:2px;transition:width 0.4s}
.meta-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:-2px 0 12px;color:#6f7697;font-size:12px;flex-wrap:wrap}

/* Two-column layout */
.match-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;align-items:start}

/* Left: image cards */
.chars-col{display:flex;flex-direction:column;gap:8px}

.char-row{background:#16213e;border:2px solid #334;border-radius:12px;overflow:hidden;transition:border-color 0.15s,box-shadow 0.15s;position:relative}
.char-row:not(.revealed){cursor:pointer}
.char-row:not(.revealed):hover{border-color:#45b7d1;box-shadow:0 0 10px rgba(69,183,209,0.3)}
.char-row.img-selected{border-color:#45b7d1;box-shadow:0 0 10px rgba(69,183,209,0.3)}
.char-row.has-pair{border-color:#7c5cbf}
.char-row.reveal-correct{border-color:#4ecdc4;background:#0b2020}
.char-row.reveal-wrong{border-color:#e74c3c;background:#200b0b}

.char-top{display:flex;align-items:center;gap:10px;padding:0 10px 0 0}
.char-img{width:64px;height:64px;object-fit:cover;flex-shrink:0;border-radius:0}
.char-meta{flex:1;min-width:0}
.char-slot{font-size:13px;padding:4px 0}
.char-slot.empty{color:#445;font-size:12px}
.char-slot.filled{color:#c8a8ff;font-weight:600}
.char-slot.correct-text{color:#4ecdc4;font-weight:700}
.char-slot.wrong-text{display:flex;flex-direction:column;gap:1px}
.wrong-chosen{color:#e74c3c;font-size:12px;text-decoration:line-through}
.correct-answer{color:#4ecdc4;font-size:11px}
.result-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.result-badge.c{background:#4ecdc4;color:#0d2f2f}
.result-badge.w{background:#e74c3c;color:#fff}

/* Reason input */
.reason-wrap{border-top:1px solid #223;padding:6px 10px 8px}
.reason-label{font-size:10px;color:#445;letter-spacing:.5px;margin-bottom:4px}
.reason-input{width:100%;background:#111827;border:1px solid #334;border-radius:6px;color:#ccc;font-size:12px;padding:5px 8px;font-family:inherit;resize:none;height:44px;line-height:1.5;transition:border-color 0.15s}
.reason-input:focus{outline:none;border-color:#7c5cbf}
.reason-input:disabled{opacity:0.5;cursor:not-allowed}
.reason-reveal{font-size:13px;color:#e5e7eb;padding:2px 0;font-style:normal;line-height:1.65;white-space:pre-wrap}
.reason-reveal.empty{color:#5b6285;font-style:italic}

/* Right: names list */
.names-col{background:#16213e;border:1px solid #334;border-radius:12px;padding:12px;position:sticky;top:16px}
.names-col-title{font-size:11px;color:#555;letter-spacing:1px;margin-bottom:10px}
.names-grid{display:flex;flex-direction:column;gap:5px}
.name-chip{background:#1a1a2e;border:1.5px solid #334;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;transition:all 0.12s;color:#ccc;user-select:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.name-chip:hover{border-color:#556;background:#1f1f3a}
.name-chip.name-selected{background:#1a2a40;border-color:#45b7d1;color:#7dd3fc;font-weight:600}
.name-chip.name-used{background:#1a1040;border-color:#7c5cbf;color:#c8a8ff}
.name-chip.name-used:hover{border-color:#9b7de0}
.used-dot{width:7px;height:7px;border-radius:50%;background:#7c5cbf;flex-shrink:0}
.name-chip.r-correct{border-color:#4ecdc4;background:#0b2020;color:#4ecdc4;cursor:default}
.name-chip.r-wrong{border-color:#e74c3c;background:#200b0b;color:#f87171;cursor:default}
.name-chip.r-unused{border-color:#223;background:#111;color:#333;cursor:default}

/* Reveal banner */
.reveal-banner{text-align:center;background:#16213e;border:1px solid #334;border-radius:12px;padding:14px;margin-bottom:14px}
.reveal-pct{font-size:42px;font-weight:700;color:#ffd700}
.reveal-stats{display:flex;justify-content:center;gap:28px;margin-top:8px}
.rv-s{text-align:center}
.rv-s .n{font-size:20px;font-weight:700}
.rv-s .l{font-size:11px;color:#666}
.rv-s.cs .n{color:#4ecdc4}
.rv-s.ws .n{color:#e74c3c}
.rv-s.as .n{color:#ffd700}

/* Status + Controls */
.status-msg{text-align:center;font-size:13px;min-height:22px;margin-bottom:10px;color:#888}
.status-msg.ok{color:#4ecdc4}
.status-msg.info{color:#a78bfa}
.status-msg.warn{color:#f5a623}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #445;background:transparent;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;color:#ccc;font-family:inherit;transition:all 0.12s}
.btn:hover{background:#223;color:#fff}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.btn-primary{background:#1a4a6e;border-color:#45b7d1;color:#7dd3fc}
.btn-primary:hover{background:#1f5a85}
.btn-danger{background:#2a1515;border-color:#7a3030;color:#f87171}
.btn-danger:hover{background:#3a1a1a}
.btn-reveal{background:#2a1a4a;border-color:#a78bfa;color:#c4b5fd;font-size:14px;font-weight:600;padding:10px 24px}
.btn-reveal:hover:not(:disabled){background:#351f5a}
.btn-reveal:disabled{opacity:0.35}

/* Intro */
.intro-screen{text-align:center;padding:2.5rem 1rem}
.intro-title{font-size:30px;font-weight:700;color:#ffd700;margin-bottom:.5rem}
.intro-sub{color:#888;font-size:14px;margin-bottom:2rem;line-height:1.9}
.best-record{margin:-1rem auto 1.5rem;color:#8a93b8;font-size:13px}
.diff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:480px;margin:0 auto 2rem}
.diff-card{background:#16213e;border:2px solid #334;border-radius:12px;padding:16px;cursor:pointer;transition:all 0.15s}
.diff-card:hover,.diff-card.selected{border-color:#ffd700;background:#1c1c00}
.diff-name{font-size:16px;font-weight:700;margin-bottom:4px}
.diff-desc{font-size:12px;color:#888}
.e .diff-name{color:#4ecdc4}
.m .diff-name{color:#ffd700}
.h .diff-name{color:#e74c3c}

/* Final result */
.result-screen{text-align:center;padding:2rem 1rem}
.res-emoji{font-size:64px;margin-bottom:.8rem}
.res-title{font-size:26px;font-weight:700;color:#ffd700;margin-bottom:.4rem}
.res-sub{font-size:14px;color:#aaa;margin-bottom:.8rem}
.res-score{font-size:50px;font-weight:700;color:#4ecdc4;margin:1rem 0}
.res-detail{font-size:13px;color:#666;margin-bottom:2rem}
.res-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Inspect bank */
.inspect-screen{padding:1rem 0 2rem}
.inspect-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.inspect-title{font-size:24px;font-weight:700;color:#ffd700}
.inspect-sub{font-size:13px;color:#8a93b8}
.inspect-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.inspect-card{background:#16213e;border:1px solid #334;border-radius:12px;padding:10px}
.inspect-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#111827;margin-bottom:8px}
.inspect-id{font-size:11px;color:#7dd3fc;margin-bottom:4px;letter-spacing:.5px}
.inspect-name{font-size:15px;font-weight:600;color:#eef2ff}

@media(max-width:660px){
  .match-layout{grid-template-columns:1fr}
  .chars-col{order:2}
  .names-col{position:sticky;top:10px;z-index:5;order:1;padding:10px}
  .names-col-title{margin-bottom:8px}
  .names-grid{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;align-items:flex-start}
  .name-chip{flex:0 0 auto;width:auto;max-width:calc(25% - 5px);padding:8px 10px;font-size:12px;justify-content:center;text-align:center;min-height:34px;line-height:1.2;white-space:nowrap}
  .used-dot{display:none}
  .char-top{gap:8px}
  .char-img{width:56px;height:56px}
  .controls .btn{flex:1 1 100%}
  .diff-grid{grid-template-columns:1fr}
}
@media(max-width:420px){
  .name-chip{max-width:calc(33.333% - 4px);padding:8px 8px}
}
</style>
</head>
<body>
<div id="app">

<!-- Intro -->
<div id="intro-screen" class="intro-screen">
  <div style="font-size:64px;margin-bottom:1rem">🎮</div>
  <div class="intro-title">原神角色猜猜看</div>
  <div class="intro-sub">看图选名字，可以写下你的判断理由<br>全部配对后一次揭晓答案</div>
  <div class="best-record" id="intro-best">本地最佳成绩：--</div>
  <div class="diff-grid">
    <div class="diff-card e" onclick="selectDiff(this,'easy')">
      <div class="diff-name">简单</div>
      <div class="diff-desc">4张/轮 · 3轮</div>
    </div>
    <div class="diff-card m selected" onclick="selectDiff(this,'medium')">
      <div class="diff-name">普通</div>
      <div class="diff-desc">6张/轮 · 4轮</div>
    </div>
    <div class="diff-card h" onclick="selectDiff(this,'hard')">
      <div class="diff-name">困难</div>
      <div class="diff-desc">8张/轮 · 5轮</div>
    </div>
  </div>
  <div class="res-btns">
    <button class="btn btn-primary" style="font-size:16px;padding:12px 36px" onclick="startGame()">开始游戏 ▶</button>
    <button class="btn" onclick="showInspectBank()">显示题库</button>
  </div>
</div>

<!-- Inspect Bank -->
<div id="inspect-screen" style="display:none" class="inspect-screen">
  <div class="inspect-head">
    <div>
      <div class="inspect-title">题库总览</div>
      <div class="inspect-sub">全部角色图片与当前名字绑定</div>
    </div>
    <button class="btn" onclick="showIntro()">返回主菜单</button>
  </div>
  <div class="inspect-grid" id="inspect-grid"></div>
</div>

<!-- Game -->
<div id="game-screen" style="display:none">
  <div class="header">
    <div class="title">⚔ 原神猜猜看</div>
    <div class="round-info" id="round-info"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="meta-bar">
    <div id="score-info">当前总分 0 / 0</div>
    <div id="best-info">最佳成绩 --</div>
  </div>
  <div class="reveal-banner" id="reveal-banner" style="display:none">
    <div class="reveal-pct" id="rv-pct"></div>
    <div class="reveal-stats">
      <div class="rv-s cs"><div class="n" id="rv-c">0</div><div class="l">正确</div></div>
      <div class="rv-s ws"><div class="n" id="rv-w">0</div><div class="l">错误</div></div>
      <div class="rv-s as"><div class="n" id="rv-a">0%</div><div class="l">正确率</div></div>
    </div>
  </div>
  <div class="match-layout">
    <div class="chars-col" id="chars-col"></div>
    <div class="names-col">
      <div class="names-col-title">全部角色名 — 点击配对</div>
      <div class="names-grid" id="names-grid"></div>
    </div>
  </div>
  <div class="status-msg" id="status-msg">点击左侧角色选中，再点击右侧名字配对；可在输入框写下理由</div>
  <div class="controls" id="controls">
    <button class="btn btn-danger" id="clear-btn" onclick="clearPairs()">↺ 清空重选</button>
    <button class="btn btn-reveal" id="reveal-btn" onclick="revealResult()" disabled>全部配对后可揭晓 ✦</button>
    <button class="btn btn-primary" id="next-btn" onclick="nextRound()" style="display:none">下一轮 →</button>
  </div>
</div>

<!-- Final Result -->
<div id="result-screen" style="display:none" class="result-screen">
  <div class="res-emoji" id="res-emoji"></div>
  <div class="res-title" id="res-title"></div>
  <div class="res-sub" id="res-sub"></div>
  <div class="res-score" id="res-score"></div>
  <div class="res-detail" id="res-detail"></div>
  <div class="res-btns">
    <button class="btn" onclick="showIntro()">返回主菜单</button>
    <button class="btn btn-primary" onclick="startGame()">再玩一次</button>
  </div>
</div>

</div>

const DIFF = {
  easy:   {perRound:4, rounds:3},
  medium: {perRound:6, rounds:4},
  hard:   {perRound:8, rounds:5},
};
const STORAGE_KEY='genshin-guess-match-best-v1';
let diff='medium', state={};

function selectDiff(el,d){
  document.querySelectorAll('.diff-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected'); diff=d;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function escapeHTML(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function getBestRecord(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw?JSON.parse(raw):null;
  }catch{return null;}
}
function saveBestRecord(correct,total){
  const acc=total?Math.round(correct/total*100):0;
  const prev=getBestRecord();
  if(!prev || acc>prev.acc || (acc===prev.acc && correct>prev.correct)){
    localStorage.setItem(STORAGE_KEY,JSON.stringify({correct,total,acc,date:new Date().toLocaleDateString('zh-CN')}));
  }
}
function updateBestUI(){
  const best=getBestRecord();
  document.getElementById('intro-best').textContent=best?`本地最佳成绩：${best.correct} / ${best.total}（${best.acc}%）`:'本地最佳成绩：--';
  document.getElementById('best-info').textContent=best?`最佳 ${best.correct} / ${best.total} · ${best.acc}%`:'最佳成绩 --';
}
function showIntro(){
  ['intro-screen','game-screen','result-screen','inspect-screen'].forEach(id=>{
    document.getElementById(id).style.display=(id==='intro-screen'?'':'none');
  });
  updateBestUI();
}
function showInspectBank(){
  ['intro-screen','game-screen','result-screen','inspect-screen'].forEach(id=>{
    document.getElementById(id).style.display=(id==='inspect-screen'?'':'none');
  });
  renderInspectBank();
}
function renderInspectBank(){
  const grid=document.getElementById('inspect-grid');
  grid.innerHTML='';
  ALL_CHARS.forEach(ch=>{
    const card=document.createElement('div');
    card.className='inspect-card';
    card.innerHTML=`
      <img class="inspect-img" src="data:image/jpeg;base64,${ch.img}" alt="${escapeHTML(ch.name)}">
      <div class="inspect-id">ID ${String(ch.id).padStart(2,'0')}</div>
      <div class="inspect-name">${escapeHTML(ch.name)}</div>`;
    grid.appendChild(card);
  });
}

function startGame(){
  const cfg=DIFF[diff];
  state={cfg, round:0, totalCorrect:0, totalWrong:0,
    roundChars:[], allNames:[], pairs:{}, reasons:{},
    selectedImgId:null, revealed:false, usedCharIds:[]};
  document.getElementById('intro-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
  document.getElementById('game-screen').style.display='';
  updateBestUI();
  pickRound(); render();
}

function pickRound(){
  const cfg=state.cfg;
  const pool=ALL_CHARS.filter(c=>!state.usedCharIds.includes(c.id));
  const picked=shuffle(pool).slice(0,cfg.perRound);
  state.usedCharIds.push(...picked.map(c=>c.id));
  // No decoys — names list = exactly the picked chars, shuffled
  state.roundChars=picked;
  state.allNames=shuffle([...picked]);
  state.pairs={};
  state.reasons={};
  state.selectedImgId=null;
  state.revealed=false;
}

function updateReason(charId,value){
  state.reasons[charId]=value;
}

function render(){
  const cfg=state.cfg;
  document.getElementById('round-info').textContent=`第 ${state.round+1} / ${cfg.rounds} 轮`;
  document.getElementById('progress-fill').style.width=((state.round+(state.revealed?1:0))/cfg.rounds*100).toFixed(0)+'%';
  document.getElementById('reveal-banner').style.display=state.revealed?'':'none';
  document.getElementById('score-info').textContent=`当前总分 ${state.totalCorrect} / ${state.totalCorrect+state.totalWrong}`;
  updateBestUI();

  const usedNameIds=new Set(Object.values(state.pairs));

  // ---- Char cards ----
  const col=document.getElementById('chars-col');
  col.innerHTML='';
  state.roundChars.forEach(ch=>{
    const pairedNameId=state.pairs[ch.id];
    const pairedName=pairedNameId!=null?state.allNames.find(n=>n.id===pairedNameId):null;
    const isSelected=state.selectedImgId===ch.id;
    const reason=state.reasons[ch.id]||'';

    let rowClass='char-row';
    if(state.revealed){
      rowClass+=(pairedNameId===ch.id)?' reveal-correct':' reveal-wrong';
      rowClass+=' revealed';
    } else {
      if(isSelected) rowClass+=' img-selected';
      else if(pairedName) rowClass+=' has-pair';
    }

    // Slot content
    let slotHTML='';
    if(state.revealed){
      if(pairedNameId===ch.id){
        slotHTML=`<div class="char-slot correct-text">✓ ${ch.name}</div>`;
      } else {
        slotHTML=`<div class="char-slot wrong-text">
          <span class="wrong-chosen">${pairedName?pairedName.name:'（未配对）'}</span>
          <span class="correct-answer">正确：${ch.name}</span>
        </div>`;
      }
    } else {
      if(pairedName) slotHTML=`<div class="char-slot filled">${pairedName.name}</div>`;
      else if(isSelected) slotHTML=`<div class="char-slot empty">← 点右侧名字配对</div>`;
      else slotHTML=`<div class="char-slot empty">点击选中</div>`;
    }

    // Result badge
    let badgeHTML='';
    if(state.revealed){
      const ok=pairedNameId===ch.id;
      badgeHTML=`<div class="result-badge ${ok?'c':'w'}">${ok?'✓':'✗'}</div>`;
    }

    // Reason area
    let reasonHTML='';
    if(state.revealed){
      reasonHTML=`<div class="reason-wrap">
        <div class="reason-label">你的理由</div>
        <div class="reason-reveal ${reason?'':'empty'}">${escapeHTML(reason||'（未填写）')}</div>
      </div>`;
    } else {
      reasonHTML=`<div class="reason-wrap">
        <div class="reason-label">判断理由（选填）</div>
        <textarea class="reason-input" id="reason-${ch.id}" placeholder="写下你认为这是该角色的原因…" oninput="updateReason(${ch.id}, this.value)">${escapeHTML(reason)}</textarea>
      </div>`;
    }

    const card=document.createElement('div');
    card.className=rowClass;
    if(!state.revealed) card.onclick=(e)=>{
      if(e.target.tagName==='TEXTAREA') return;
      onImgClick(ch.id);
    };
    card.innerHTML=`
      <div class="char-top">
        <img class="char-img" src="data:image/jpeg;base64,${ch.img}" alt="角色">
        <div class="char-meta">${slotHTML}</div>
        ${badgeHTML}
      </div>
      ${reasonHTML}`;
    col.appendChild(card);
  });

  // ---- Names list ----
  const ng=document.getElementById('names-grid');
  ng.innerHTML='';
  state.allNames.forEach(ch=>{
    const isUsed=usedNameIds.has(ch.id);
    const isSelected=state.selectedImgId!=null&&state.pairs[state.selectedImgId]===ch.id;
    let chipClass='name-chip';
    if(state.revealed){
      const matchedToCorrectChar=state.pairs[ch.id]===ch.id;
      const wasUsed=Object.values(state.pairs).includes(ch.id);
      if(wasUsed && matchedToCorrectChar) chipClass+=' r-correct';
      else if(wasUsed) chipClass+=' r-wrong';
      else chipClass+=' r-unused';
    } else {
      if(isSelected) chipClass+=' name-selected';
      if(isUsed) chipClass+=' name-used';
    }

    const chip=document.createElement('div');
    chip.className=chipClass;
    if(!state.revealed) chip.onclick=()=>onNameClick(ch.id);
    chip.innerHTML=ch.name+((!state.revealed&&isUsed)?'<span class="used-dot"></span>':'');
    ng.appendChild(chip);
  });

  // ---- Buttons ----
  const allPaired=state.roundChars.every(c=>state.pairs[c.id]!=null);
  const revealBtn=document.getElementById('reveal-btn');
  const nextBtn=document.getElementById('next-btn');
  const clearBtn=document.getElementById('clear-btn');
  if(state.revealed){
    revealBtn.style.display='none';
    clearBtn.style.display='none';
    nextBtn.style.display='inline-block';
  } else {
    revealBtn.style.display='inline-block';
    clearBtn.style.display='inline-block';
    nextBtn.style.display='none';
    revealBtn.disabled=!allPaired;
    revealBtn.textContent=allPaired?'揭晓答案！✦':`还剩 ${state.roundChars.filter(c=>!state.pairs[c.id]).length} 个未配对`;
  }
}

function onImgClick(charId){
  if(state.revealed) return;
  state.selectedImgId=(state.selectedImgId===charId)?null:charId;
  setStatus(state.selectedImgId?'已选中角色，请点击右侧名字配对':'点击左侧角色选中，再点击右侧名字配对；可在输入框写下理由',
            state.selectedImgId?'info':'');
  render();
}

function onNameClick(nameId){
  if(state.revealed) return;
  if(state.selectedImgId==null){setStatus('请先点击左侧角色头像','warn');return;}
  const charId=state.selectedImgId;
  const prevChar=Object.keys(state.pairs).find(cid=>state.pairs[cid]===nameId);
  if(prevChar && Number(prevChar)!==charId){
    delete state.pairs[prevChar];
  }
  state.pairs[charId]=nameId;
  state.selectedImgId=null;
  const allPaired=state.roundChars.every(c=>state.pairs[c.id]!=null);
  setStatus(allPaired?'全部配对完成，点击「揭晓答案」✦':'配对已更新，可继续修改；不会清空你填写的理由', 'ok');
  render();
}

function clearPairs(){
  state.pairs={};
  state.selectedImgId=null;
  setStatus('已清空配对，重新开始','warn');
  render();
}

function revealResult(){
  state.revealed=true;
  let correct=0,wrong=0;
  state.roundChars.forEach(ch=>{
    if(state.pairs[ch.id]===ch.id) correct++; else wrong++;
  });
  state.totalCorrect+=correct; state.totalWrong+=wrong;
  const acc=Math.round(correct/state.roundChars.length*100);
  document.getElementById('rv-pct').textContent=acc+'%';
  document.getElementById('rv-c').textContent=correct;
  document.getElementById('rv-w').textContent=wrong;
  document.getElementById('rv-a').textContent=acc+'%';
  setStatus('','');
  render();
}

function nextRound(){
  state.round++;
  if(state.round>=state.cfg.rounds){showFinalResult();return;}
  pickRound(); render();
  setStatus('点击左侧角色选中，再点击右侧名字配对；可在输入框写下理由','');
}

function showFinalResult(){
  document.getElementById('game-screen').style.display='none';
  document.getElementById('result-screen').style.display='';
  const total=state.totalCorrect+state.totalWrong;
  const acc=total>0?Math.round(state.totalCorrect/total*100):0;
  saveBestRecord(state.totalCorrect,total);
  const tbl=[['🏆','传说旅行者！','你对提瓦特了如指掌！',90],['⭐','资深旅行者','认识大多数角色，继续冒险！',70],['🌟','初级旅行者','还有很多角色等你认识哦~',50],['🌱','初出茅庐','多刷几遍就能认全啦！',0]];
  const [emoji,title,sub]=tbl.find(([,,,t])=>acc>=t);
  const best=getBestRecord();
  document.getElementById('res-emoji').textContent=emoji;
  document.getElementById('res-title').textContent=title;
  document.getElementById('res-sub').textContent=sub;
  document.getElementById('res-score').textContent=state.totalCorrect+' / '+total+' 正确';
  document.getElementById('res-detail').textContent=`总正确率 ${acc}% · 共 ${state.cfg.rounds} 轮 · 本地最佳 ${best?`${best.correct} / ${best.total}（${best.acc}%）`:'--'}`;
}

function setStatus(msg,type){
  const el=document.getElementById('status-msg');
  el.textContent=msg;el.className='status-msg'+(type?' '+type:'');
}
showIntro();
</script>

</html>
